services:
  gateway:
    image: folia-local/web:check
    build:
      context: ../..
      dockerfile: deploy/docker/images/gateway.Dockerfile
      args:
        VCS_REF: ${FOLIA_BUILD_VCS_REF:-local}
        STACK_VERSION: ${FOLIA_STACK_VERSION:-local}
  backend:
    image: folia-local/web-api:check
    build:
      context: ../..
      dockerfile: deploy/docker/images/backend.Dockerfile
  sync-server:
    image: folia-local/sync-server:check
    build:
      context: ../..
      dockerfile: deploy/docker/images/sync-server.Dockerfile
